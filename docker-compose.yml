services:
  neo4j:
    image: neo4j:5.26
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    ports: ["7474:7474", "7687:7687"]   # 7474 = Neo4j Browser, 7687 = Bolt
    volumes: [neo4j_data:/data]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_AUTH#neo4j/} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12

  backend:
    build: ./backend
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      DATA_DIR: /app/data
    volumes: ["./data:/app/data"]
    ports: ["8000:8000"]
    depends_on:
      neo4j: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["3100:80"]
    depends_on: [backend]

volumes:
  neo4j_data:
